<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Fretboard</title>
    <style>
        :root {
            --wood-color: #3d2314;
            --fret-color: #c0c0c0;
            --string-color: #e0e0e0;
            --note-color: #ff4757;
            --highlight-color: #2ed573;
            --quiz-color: #1e90ff;

        }
body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f1f2f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 {
            color: #2f3542;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #747d8c;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            background: white;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        button {
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            background-color: #747d8c;
            transition: all 0.2s ease;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        #scale-btn.active {
            background-color: var(--highlight-color);
        }

        #quiz-btn {
            background-color: var(--quiz-color);
        }

        #quiz-btn.active {
            background-color: #ff4757;
        }

        #quiz-prompt {
            font-size: 16px;
            font-weight: bold;
            color: #2f3542;
            min-width: 150px;
        }


        .fretboard {
            display: grid;
            grid-template-rows: repeat(6, 40px); /* 6 Strings */
            background-color: var(--wood-color);
            border: 4px solid #2d1a0e;
            border-radius: 4px;
            width: 100%;
            max-width: 800px;
            margin: 50px auto;
            position: relative;
        }
.string {
            display: grid;
            grid-template-columns: repeat(5, 1fr); /* Open note + 4 Frets */
            align-items: center;
            position: relative;
        }

        /* Draw the actual guitar string line using CSS */
        .string::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 2px;
            background-color: var(--string-color);
            z-index: 1;
            pointer-events: none;
        }

        .note {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            border-right: 3px solid var(--fret-color); /* Fret wires */
            position: relative;
            cursor: pointer;
            z-index: 2;
        }

        /* Interactive Note Popup */
        .note::before {
            content: attr(data-note);
            position: absolute;
            background-color: var(--note-color);
            color: white;
            font-family: sans-serif;
            font-weight: bold;
            font-size: 14px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.2s ease, transform 0.2s ease;
            transform: scale(0.5);
        }

        /* Reveal the note on hover */
        .note:hover::before {
opacity: 1;
            transform: scale(1);
        }
    </style>
</head>
<body>

    <h2 style="text-align:center; font-family:sans-serif; color:#333;">Pure CSS Interactive Fretboard (Hover to see notes)</h2>

    <div class="fretboard">
        <!-- High E String -->
        <div class="string">
            <div class="note" data-note="E"></div>
            <div class="note" data-note="F"></div>
            <div class="note" data-note="F#"></div>
            <div class="note" data-note="G"></div>
            <div class="note" data-note="G#"></div>
        </div>
<!-- B String -->
        <div class="string">
            <div class="note" data-note="B"></div>
            <div class="note" data-note="C"></div>
            <div class="note" data-note="C#"></div>
            <div class="note" data-note="D"></div>
            <div class="note" data-note="D#"></div>
        </div>
        <!-- G String -->
        <div class="string">
            <div class="note" data-note="G"></div>
            <div class="note" data-note="G#"></div>
            <div class="note" data-note="A"></div>
            <div class="note" data-note="A#"></div>
            <div class="note" data-note="B"></div>
        </div>
<!-- D String -->
        <div class="string">
            <div class="note" data-note="D"></div>
            <div class="note" data-note="D#"></div>
            <div class="note" data-note="E"></div>
            <div class="note" data-note="F"></div>
            <div class="note" data-note="F#"></div>
        </div>
        <!-- A String -->
        <div class="string">
            <div class="note" data-note="A"></div>
            <div class="note" data-note="A#"></div>
            <div class="note" data-note="B"></div>
            <div class="note" data-note="C"></div>
            <div class="note" data-note="C#"></div>
        </div>
        <!-- Low E String -->
        <div class="string">
            <div class="note" data-note="E"></div>
            <div class="note" data-note="F"></div>
            <div class="note" data-note="F#"></div>
<div class="note" data-note="G"></div>
            <div class="note" data-note="G#"></div>
        </div>
    </div>
